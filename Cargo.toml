[package]
name = "artemis-telemetry-link"
version = "0.1.0"
edition = "2021"
authors = ["Olumide Lala <olumidelala22@gmail.com>"]
description = "High-reliability vehicle telemetry daemon, framing codec, and fail-safe state machine for autonomous platforms operating over lossy datalinks."

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
