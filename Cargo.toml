[package]
name = "artemis-telemetry-link"
version = "0.1.0"
edition = "2021"
authors = ["Olumide Lala"]
description = "A systems prototype in Rust: binary datalink framing, RF link monitoring, HMAC command authentication, and failsafe state machine for unmanned platforms."

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
